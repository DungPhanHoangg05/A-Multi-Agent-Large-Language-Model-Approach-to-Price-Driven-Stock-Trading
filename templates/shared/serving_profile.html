{% macro select_profile(id) -%}
<label class="serving-field" for="{{ id }}">{{ 'Hồ sơ chạy' if LANG == 'vi' else 'Execution profile' }}
  <select id="{{ id }}">
    <option value="{{ serving_registry.contract_version }}">{{ 'Bản hiện hành' if LANG == 'vi' else 'Current release' }}</option>
    {% for version in serving_registry.opt_in_profiles %}
    <option value="{{ version }}">{{ 'Bản sửa · thử nghiệm' if LANG == 'vi' else 'Repaired profile · exploratory' }}</option>
    {% endfor %}
  </select>
</label>
{%- endmacro %}
