<section class="serving-ui" aria-label="{{ A.analysis }}">
  <label class="serving-field">{{ A.version }}<select id="analysis-version">{% for variant in serving_registry.variants if variant.group == 'main' %}<option value="{{ variant.id }}">{{ variant.label[LANG] }}</option>{% endfor %}</select></label>
  <p id="version-description"></p>
  <p>{{ A.daily_note }}</p>
  <p id="timeframe-run-status" role="status" aria-live="polite"></p>
  <a id="last-serving-job" hidden>{{ A.last }}</a>
</section>
